<!DOCTYPE html>
<html lang="en"
xmlns:th="https://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <title>Sign up</title>
</head>

<body>

<h1>Opret en konto</h1>

<form onsubmit="alert('Your account is now created! ')" th:action="@{/register}" th:object="${newAccount}" method ="post">

    <label for="1"> Name </label>
    <input id="1" type="text" th:field="*{name}" required>
    <br>
    <label for="2"> Email </label>
    <input id="2" type="email" th:field="*{email}" required>
    <br>
    <label for="3"> Password </label>
    <input id="3" type="password" th:field="*{password}" required>
    <br>
    <button type="submit"> Create user </button>
    <a th:href="@{/login}"> Back </a>

</form>

</body>
</html>
